name: Publish Audisor AMD Track 1 529db04

on:
  push:
    branches:
      - release/publish-529db04
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  SOURCE_SHA: 529db04a7c0ba81b9d7d222759d036c18382db7d
  IMAGE: ghcr.io/itz1508/audisor-amd-track1:529db04

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out the exact runtime commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Assert checked-out source
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Log in to GHCR with the workflow token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push amd64 image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          provenance: false
          sbom: false

      - name: Publish immutable reference
        shell: bash
        run: |
          echo "registry_digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "submission_reference=ghcr.io/itz1508/audisor-amd-track1@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
